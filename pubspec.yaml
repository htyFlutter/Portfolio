name: portfolio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  google_generative_ai: ^0.4.7
  material_symbols_icons: ^4.2960.0
  flutter_launcher_icons: ^0.14.4
  flutter_math_fork: ^0.7.4
  
  
  shared_preferences: ^2.3.5

  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/app_laucher_icon.png
    - lib/assets/question.json

flutter_icons:
  image_path_android: lib/assets/images/app_laucher_icon.png
  adaptive_icon_background: '#000000' #iconの背景色
  adaptive_icon_foreground: lib/assets/images/app_laucher_icon.png
  image_path_ios: lib/assets/images/app_laucher_icon.png
  android: true
  adaptive_icon_padding: true
  min_sdk_android: 30 #Androidの最小SDKバージョン
  ios: true   